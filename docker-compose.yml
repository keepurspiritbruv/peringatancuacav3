services:
  redis:
    image: redis:7-alpine
    container_name: peringatan-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: peringatan-mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  ml:
    build:
      context: ./SHAP-model-api
      dockerfile: Dockerfile
    container_name: peringatan-ml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./disaster-backend
      dockerfile: Dockerfile
    container_name: peringatan-backend
    restart: unless-stopped
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      ML_BASE_URL: http://ml:8000
      DATABASE_URL: sqlite:///app/data/disaster.db
      BASE_URL: ${BASE_URL:-https://api.samudraapp.id}
      JWT_AUTH_ENABLED: ${JWT_AUTH_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-}
      OPENCLAW_GATEWAY_URL: ${OPENCLAW_GATEWAY_URL:-}
      OPENCLAW_HOOK_TOKEN: ${OPENCLAW_HOOK_TOKEN:-}
      OPENCLAW_BROADCAST_GROUPS: ${OPENCLAW_BROADCAST_GROUPS:-}
      WEATHERAPI_KEY: ${WEATHERAPI_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      XGBOOST_BASE_URL: http://ml:8000
      ENABLE_IOT_MQTT_DELIVERY: ${ENABLE_IOT_MQTT_DELIVERY:-true}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-mqtt://mosquitto:1883}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-alert}
      MQTT_QOS: ${MQTT_QOS:-1}
      MQTT_RETAIN: ${MQTT_RETAIN:-false}
      MQTT_ALARM_DURATION_MS: ${MQTT_ALARM_DURATION_MS:-15000}
      MQTT_PUBLISH_TIMEOUT_MS: ${MQTT_PUBLISH_TIMEOUT_MS:-2000}
    volumes:
      - backend_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
      ml:
        condition: service_healthy
    networks:
      - default
      - shared-net
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.peringatan-backend.rule=Host(`api.samudraapp.id`)"
      - "traefik.http.routers.peringatan-backend.entrypoints=websecure"
      - "traefik.http.routers.peringatan-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.peringatan-backend.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik-public"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: https://api.samudraapp.id
    container_name: peringatan-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: https://api.samudraapp.id
    depends_on:
      - backend
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.peringatan-frontend.rule=Host(`samudraapp.id`) || Host(`www.samudraapp.id`)"
      - "traefik.http.routers.peringatan-frontend.entrypoints=websecure"
      - "traefik.http.routers.peringatan-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.peringatan-frontend.loadbalancer.server.port=3001"
      - "traefik.docker.network=traefik-public"

  openclaw-bridge:
    build:
      context: ./openclaw-bridge
      dockerfile: Dockerfile
    container_name: peringatan-openclaw-bridge
    restart: unless-stopped
    environment:
      GATEWAY_WS_URL: ws://openclaw-openclaw-gateway-1:18789
      GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      BACKEND_WEBHOOK_URL: http://peringatan-backend:3000/api/openclaw/webhook
    depends_on:
      - backend
    networks:
      - default

volumes:
  redis_data:
  backend_data:

networks:
  shared-net:
    external: true
  traefik-public:
    external: true
