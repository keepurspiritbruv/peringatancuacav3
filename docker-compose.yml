services:
  redis:
    image: redis:7-alpine
    container_name: thesis-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml:
    build:
      context: ./SHAP-model-api
      dockerfile: Dockerfile
    container_name: thesis-ml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./disaster-backend
      dockerfile: Dockerfile
    container_name: thesis-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      ML_BASE_URL: http://ml:8000
      DATABASE_URL: sqlite:///app/data/disaster.db
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      JWT_AUTH_ENABLED: ${JWT_AUTH_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-}
      OPENCLAW_GATEWAY_URL: ${OPENCLAW_GATEWAY_URL:-}
      OPENCLAW_HOOK_TOKEN: ${OPENCLAW_HOOK_TOKEN:-}
      OPENCLAW_BROADCAST_GROUPS: ${OPENCLAW_BROADCAST_GROUPS:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    volumes:
      - backend_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:3000
    container_name: thesis-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend

volumes:
  redis_data:
  backend_data:
